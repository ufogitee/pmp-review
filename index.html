<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="软考高项 · 八大项目绩效域紧凑复习板" />
    <title>高项 · 八大绩效域复习板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mode-overview">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>八大绩效域复习板</h1>
          <div class="sub">软考高项 · PMBOK7 / 教程第4版 · 一屏紧凑背诵</div>
          <div class="mnemonic" id="mnemonic"></div>
        </div>
        <div class="controls">
          <button type="button" class="mode-btn active" data-mode="overview">总览</button>
          <button type="button" class="mode-btn" data-mode="collapse">折叠</button>
          <button type="button" class="mode-btn" data-mode="quiz">自测</button>
          <button type="button" class="tool-btn" id="btn-expand">全开</button>
          <button type="button" class="tool-btn" id="btn-fold">全收</button>
          <button type="button" class="tool-btn" id="btn-print">打印</button>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="搜索考点…" autocomplete="off" />
          </div>
        </div>
      </header>

      <nav class="domain-nav" id="domain-nav" aria-label="绩效域导航"></nav>

      <main class="panel" id="main"></main>

      <footer class="footer">
        快捷键：<kbd>1</kbd>–<kbd>8</kbd> 切换绩效域 ·
        <kbd>Q</kbd> 总览 · <kbd>W</kbd> 折叠 · <kbd>E</kbd> 自测 ·
        双击打开本文件即可离线复习（首次需联网加载字体）
      </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
