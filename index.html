<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="软考高项 · 八大绩效域与十大知识领域紧凑复习板" />
    <title>高项复习板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mode-overview" data-module="perf">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>高项复习板</h1>
          <div class="sub">软考高项 · 绩效域 / 知识领域 · 一屏紧凑背诵</div>
          <div class="mnemonic-row">
            <span class="mnemonic" id="mnemonic"></span>
            <span class="mnemonic-note" id="mnemonic-note"></span>
          </div>
        </div>
        <div class="controls">
          <div class="module-switch" role="tablist" aria-label="模块切换">
            <button type="button" class="module-btn active" data-module="perf">绩效域</button>
            <button type="button" class="module-btn" data-module="ka">知识领域</button>
          </div>
          <button type="button" class="mode-btn active" data-mode="overview">总览</button>
          <button type="button" class="mode-btn" data-mode="collapse">折叠</button>
          <button type="button" class="mode-btn" data-mode="quiz">自测</button>
          <button type="button" class="tool-btn" id="btn-expand">全开</button>
          <button type="button" class="tool-btn" id="btn-fold">全收</button>
          <button type="button" class="tool-btn" id="btn-print">打印</button>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="搜索考点…" autocomplete="off" />
          </div>
        </div>
      </header>

      <nav class="domain-nav" id="domain-nav" data-module="perf" aria-label="条目导航"></nav>

      <main class="panel" id="main"></main>
      <p class="search-empty hidden" id="search-empty">当前模块无匹配，可切换另一模块再搜</p>

      <footer class="footer">
        <kbd>A</kbd> 绩效域 · <kbd>S</kbd> 知识领域 ·
        <kbd>1</kbd>–<kbd>0</kbd> 切换条目 ·
        <kbd>Q</kbd> 总览 · <kbd>W</kbd> 折叠 · <kbd>E</kbd> 自测
      </footer>
    </div>

    <script src="data.js"></script>
    <script src="knowledge-areas.js"></script>
    <script src="app.js"></script>
  </body>
</html>
